name: release

# Срабатывает при каждом пуше в main, который меняет версию (.claude-plugin/plugin.json,
# package.json) или CHANGELOG.md. Ченжлог — неотъемлемая часть публикации: если релиза с
# таким номером ещё нет, а секции "## [X.Y.Z]" в CHANGELOG.md нет — шаг падает и релиз
# не создаётся; допиши секцию и пушни — пуш CHANGELOG.md перезапускает публикацию.
# Если секция есть — тело релиза берётся из неё, авто-заметки GitHub (список коммитов
# с прошлого тега и ссылка Full Changelog) добавляются всегда.
# Ничего не публикует, если релиз уже существует.

on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/plugin.json"
      - "package.json"
      - "CHANGELOG.md"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true # без тегов проверка ниже всегда видит exists=false

      - name: Read version from plugin.json
        id: v
        run: |
          VERSION=$(node -p "require('./.claude-plugin/plugin.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        id: notes
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          if ! awk -v ver="$VERSION" '
              index($0, "## [" ver "]") == 1 { insec=1; next }
              /^## / { insec=0 }
              insec { print }
            ' CHANGELOG.md 2>/dev/null > release_notes.md || ! grep -q . release_notes.md; then
            echo "no CHANGELOG.md section (## [$VERSION]) for the pending release - the changelog is an integral part of publishing; add the section and push (a CHANGELOG.md push retriggers this run)" >&2
            exit 1
          fi

      - name: Create release with changelog
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: ${{ steps.v.outputs.version }}
          generate_release_notes: true
          body_path: release_notes.md
