<!doctype html>
<html lang="ru" data-theme="__GRILL_THEME__">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>grill</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#f7f4ee, #16130f); --panel: light-dark(#ffffff, #1e1a15); --ink: light-dark(#1f1c18, #ece7dd);
    --ink-2: light-dark(#625b51, #b3aa9c); --ink-3: light-dark(#9a9285, #7d7568); --rule: light-dark(#e6e0d4, #322c24); --hover: light-dark(#efebe3, #2a241d);
    --accent: light-dark(#9a3a26, #d9d1c3); --ok: light-dark(#3d6b4a, #7fb08d); --ok-soft: light-dark(#e3eee5, #1f2b22); --ok-deep: light-dark(#2f5a3b, #6ea07c); --ok-pulse: light-dark(#7fb08d, #a9d6b6);
    --stage: light-dark(#b8791f, #d9a441); --stage-soft: light-dark(#f8ecd2, #2e2616); --warn-soft: light-dark(#fbe9e4, #38211b);
    /* Text and ticks on an --accent or --ok fill. Those fills turn light in the dark theme, where white on them drops to 3:1 and below. */
    --on-fill: light-dark(#ffffff, #16130f);
    /* Importance levels and rating chips. In the dark theme the accent is a neutral off-white, so
       red means only Decide carefully (its own --careful, which never moves with the accent) or a
       poor rating. */
    --accent-soft: light-dark(#fbefeb, #2c2720); --accent-line: light-dark(#e7c9c0, #4a4238);
    --careful: light-dark(#9a3a26, #e0785c); --careful-soft: light-dark(#fbefeb, #38211b); --careful-line: light-dark(#e7c9c0, #5a2e24); --stage-line: light-dark(#ecd6ae, #4a3a1c);
    --taste: light-dark(#5d4a86, #b4a2e0); --taste-soft: light-dark(#f1edf7, #251f33); --taste-line: light-dark(#d6cde6, #3d3352);
    --check-ink: light-dark(#7f5413, #e0b45a); --skim-ink: light-dark(#625b51, #b3aa9c);
    --chip-g-bg: light-dark(#e3eee5, #1f2b22); --chip-g-ink: light-dark(#2f5a3b, #8fc29d); --chip-g-line: light-dark(#c7dccb, #2f4a36);
    --chip-x-bg: light-dark(#f8ecd2, #2e2616); --chip-x-ink: light-dark(#7f5413, #e0b45a); --chip-x-line: light-dark(#ead3a2, #4a3a1c);
    --chip-p-bg: light-dark(#fbe4dd, #38211b); --chip-p-ink: light-dark(#9a3a26, #ec8b72); --chip-p-line: light-dark(#f0c7bb, #5a2e24);
    --serif: "Iowan Old Style", Charter, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans); font-size: 15px; line-height: 1.5; color: var(--ink); background: var(--bg);
    display: grid; grid-template-rows: auto auto 1fr auto; grid-template-columns: 260px minmax(0, 1fr) 33vw; height: 100vh;
  }
  a { color: var(--accent); }
  /* Rows are pinned: the banner is display:none most of the time, and auto-placement would
     otherwise slide the content into the "auto" row and stretch the footer into the "1fr" row. */
  #banner { grid-row: 1; grid-column: 1 / -1; display: none; padding: 9px 24px; font-size: 14px; background: var(--warn-soft); color: var(--accent); border-bottom: 1px solid var(--rule); }
  #banner.show { display: block; } #banner.done { background: var(--ok-soft); color: var(--ok); }

  header { grid-row: 2; grid-column: 1 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 14px; padding: 12px 24px; border-bottom: 1px solid var(--rule); background: var(--panel); position: relative; }
  header h1 { font-family: var(--serif); font-weight: 500; font-size: 20px; margin: 0; }
  header .path { color: var(--ink-3); font-size: 13px; }
  #intent { display: none; flex-basis: 100%; order: 10; font-size: 14px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #intent.show { display: block; }
  #intent.show.open { white-space: normal; }
  #intent.show.clamped { cursor: pointer; }
  header .status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); } header .status .spin { color: var(--stage); }
  header .lang { font: inherit; font-size: 13px; color: var(--ink-2); background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 4px 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot.working { background: var(--stage); animation: pulse 1.2s ease-in-out infinite; }
  .dot.gone { background: var(--ink-3); }
  .dot.unheard { background: transparent; box-shadow: inset 0 0 0 1.5px var(--stage); }
  @keyframes pulse { 50% { opacity: .3; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .attach-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .attach-formats { color: var(--ink-3); font-size: 12px; }
  .attach-why { color: var(--ink-3); font-size: 12px; }
  .attach-row { flex-wrap: wrap; }
  .ok-mark { display: inline-block; color: var(--ok); font-size: 12px; font-weight: 700; margin-right: 6px; vertical-align: -1px; flex-shrink: 0; }
  .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; flex-shrink: 0; }
  #progress { display: none; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; background: var(--stage-soft); }
  header.working #progress { display: block; }
  #progress::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: var(--stage); animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { left: -30%; } to { left: 100%; } }
  #levels-toggle, #terms-toggle, #visualize { font-size: 12px; padding: 4px 10px; }
  #theme-toggle { display: inline-flex; align-items: center; padding: 4px 8px; }
  #theme-toggle svg { display: none; width: 15px; height: 15px; }
  #theme-toggle[data-mode="system"] .i-system, #theme-toggle[data-mode="light"] .i-light, #theme-toggle[data-mode="dark"] .i-dark { display: block; }
  #visualize .spin { width: 9px; height: 9px; margin-right: 4px; }
  #visualize:disabled { background: var(--panel); border-color: var(--rule); color: var(--ink-3); }
  #subagent-opt { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  #subagent-opt[hidden] { display: none; }
  #subagent-opt input { margin: 0; accent-color: var(--accent); }
  #subagent-opt label { cursor: pointer; }
  .info { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--ink-3); color: var(--ink-3); font: italic 600 10px/1 var(--serif); cursor: help; }
  .info:hover, .info:focus { color: var(--ink); border-color: var(--ink); outline: none; }
  .info::after { content: attr(data-tip); display: none; position: absolute; top: calc(100% + 8px); right: -8px; width: 260px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.08); color: var(--ink-2); font: 12px/1.45 system-ui, sans-serif; font-style: normal; white-space: normal; text-align: left; z-index: 6; }
  .info:hover::after, .info:focus::after { display: block; }
  #terms { display: none; position: absolute; right: 24px; top: 100%; width: 420px; max-height: 60vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 16px; box-shadow: 0 8px 24px rgba(0,0,0,.08); z-index: 5; }
  #terms.show { display: block; }
  .term { padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 14px; } .term:last-child { border-bottom: 0; }
  .term b { font-family: var(--serif); font-weight: 500; font-size: 15px; } .term .avoid { color: var(--ink-3); font-size: 12px; }
  #levels { display: none; position: absolute; right: 24px; top: 100%; width: 400px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 16px; box-shadow: 0 8px 24px rgba(0,0,0,.08); z-index: 5; font-size: 13px; }
  #levels.show { display: block; }
  #levels h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  .lv-row { display: grid; grid-template-columns: 22px 120px 1fr; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--rule); }
  .lv-row:last-child { border-bottom: 0; }
  .lv-row b { font-weight: 600; font-size: 13px; } .lv-row .d { color: var(--ink-2); }
  .sdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .sdot.yours { border-radius: 1px; transform: rotate(45deg); width: 8px; height: 8px; }
  .sdot.skim { background: transparent; border: 1.5px solid currentColor; }
  .lvc-careful { color: var(--careful); } .lvc-yours { color: var(--taste); } .lvc-check { color: var(--stage); } .lvc-skim { color: var(--ink-3); }

  nav { grid-row: 3; grid-column: 1; border-right: 1px solid var(--rule); overflow-y: auto; padding: 10px 0 24px; }
  nav .note { margin: 6px 14px 4px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; font-size: 13px; color: var(--ink-2); }
  nav .round { padding: 14px 16px 4px 20px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); display: flex; justify-content: space-between; }
  nav .round.current { color: var(--accent); }
  .item { display: grid; grid-template-columns: 30px 1fr auto; gap: 0 8px; align-items: baseline; padding: 8px 20px; cursor: pointer; }
  .item:hover { background: var(--hover); }
  .item.selected { background: var(--panel); box-shadow: inset 3px 0 0 var(--accent); }
  /* Имя вопроса — метка, а не текст: в четыре строки его читать незачем. */
  .item .id { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .t { font-size: 14px; }
  /* Only Decide carefully and Your call rows carry a word; Skim and Check rows carry no mark. */
  .item .sword { grid-column: 2; font-size: 11px; font-weight: 600; letter-spacing: .02em; margin-top: 1px; } .item .sword.done { opacity: .45; }
  .item .mark { font-size: 11px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 4px; }
  .item .mark svg { width: 12px; height: 12px; }
  .mark.answered { color: var(--ok); } .mark.open, .mark.reopened { color: var(--accent); } .mark.staged { color: var(--stage); font-weight: 600; } .mark.pending { color: var(--stage); }
  .item.updated .t::after { content: attr(data-upd); font-size: 10px; color: var(--stage); margin-left: 6px; letter-spacing: .06em; text-transform: uppercase; }
  nav .empty { padding: 20px; font-size: 13px; color: var(--ink-3); }

  /* Visualize view: the list and card columns give way to the visual; the right panel becomes its feedback. */
  #visual { grid-row: 3; grid-column: 1 / 3; display: none; grid-template-rows: auto 1fr; min-height: 0; background: var(--panel); }
  body.visualize #visual { display: grid; } body.visualize nav, body.visualize main { display: none; }
  #visual-strip { display: flex; align-items: center; flex-wrap: nowrap; gap: 14px; padding: 8px 24px; border-bottom: 1px solid var(--rule); font-size: 13px; color: var(--ink-2); background: var(--bg); }
  /* Полоса — всегда одна строка: кнопки не переносятся, уступает длинная подпись (усечение, полный текст в title). */
  #visual-strip > * { flex: none; }
  #visual-strip .kind { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; white-space: nowrap; }
  #visual-strip .ver { color: var(--ink-3); flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #visual-strip .ver b { color: var(--ink-2); font-weight: 600; }
  #visual-stale { color: var(--stage); font-size: 12px; white-space: nowrap; }
  #visual-strip .right { margin-left: auto; display: flex; align-items: center; flex-wrap: nowrap; gap: 10px; color: var(--stage); white-space: nowrap; }
  #visual-strip a { color: var(--ink-3); text-decoration: none; font-size: 13px; white-space: nowrap; } #visual-strip a:hover { color: var(--accent); }
  /* Во всё окно: визуал забирает и колонку обратной связи. Обратное — режим общения. */
  body.visualize.visual-wide #visual { grid-column: 1 / -1; }
  body.visualize.visual-wide aside { display: none; }
  #visual-strip .wide { color: var(--ink-3); text-decoration: none; font-size: 13px; cursor: pointer; }
  #visual-strip .wide:hover { color: var(--accent); }
  #visual-frame { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
  #visual-wait { display: flex; align-items: center; justify-content: center; gap: 10px; height: 100%; color: var(--ink-3); font-size: 14px; background: var(--panel); }
  #visual-wait[hidden], #visual-frame[hidden] { display: none; }

  main { grid-row: 3; grid-column: 2; overflow-y: auto; padding: 36px 44px 60px; background: var(--panel); }
  .card { max-width: 680px; }
  .crumb { font-size: 12px; color: var(--ink-3); display: flex; gap: 12px; flex-wrap: wrap; }
  .crumb a { text-decoration: none; } .crumb .upd { color: var(--stage); }
  .imp { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 4px 10px; border-radius: 999px; font-size: 12px; border: 1px solid; }
  .imp b { font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 11px; }
  .imp .why-l { color: var(--ink-2); }
  .imp.careful { color: var(--careful); border-color: var(--careful-line); background: var(--careful-soft); }
  .imp.check { color: var(--check-ink); border-color: var(--stage-line); background: var(--stage-soft); }
  .imp.skim { color: var(--skim-ink); border-color: var(--rule); background: var(--bg); }
  .imp.yours { color: var(--taste); border-color: var(--taste-line); background: var(--taste-soft); }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 8px 0 12px; }
  .card h2 { font-family: var(--serif); font-weight: 500; font-size: 30px; line-height: 1.15; margin: 0; }
  #explore { font-size: 13px; padding: 6px 12px; flex-shrink: 0; }
  #explore:disabled { background: var(--panel); border-color: var(--rule); color: var(--ink-3); }
  .card .body { font-size: 15px; color: var(--ink-2); max-width: 62ch; margin: 0; white-space: pre-line; }
  .card .body code, .opt code, .why code, .msg .text code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; background: var(--hover); padding: 1px 5px; border-radius: 4px; }
  .card .body a, .opt a, .why a, .msg .text a { color: var(--accent); }
  .opts { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 8px; }
  .opt { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); cursor: pointer; }
  .opt .check { width: 20px; height: 20px; color: var(--ok); visibility: hidden; align-self: center; }
  .opt .check svg, .mark svg { display: block; width: 100%; height: 100%; }
  .opt .check path, .mark path { stroke: var(--on-fill); }
  .opt:hover { border-color: var(--ink-3); }
  .opt .k { font-family: var(--serif); font-size: 18px; line-height: 1.2; color: var(--ink-3); }
  .opt.rec { border-color: var(--accent); } .opt.rec .k { color: var(--accent); }
  .opt .tag { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
  .opt.lean { border-color: var(--taste); } .opt.lean .k, .opt.lean .tag { color: var(--taste); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .chip { font-size: 11.5px; line-height: 1; padding: 4px 8px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
  .chip.g { background: var(--chip-g-bg); color: var(--chip-g-ink); border-color: var(--chip-g-line); }
  .chip.x { background: var(--chip-x-bg); color: var(--chip-x-ink); border-color: var(--chip-x-line); }
  .chip.p { background: var(--chip-p-bg); color: var(--chip-p-ink); border-color: var(--chip-p-line); }
  .opt.chosen { background: var(--ok-soft); border-color: var(--ok); } .opt.chosen .k, .opt.chosen .tag { color: var(--ok); } .opt.chosen .check { visibility: visible; }
  /* Once an answer is picked (staged or recorded), everything but the picked box reads as disabled; hover or focus wakes a part back up. */
  .card.picked .body, .card.picked .why, .card.picked .note-taste, .card.picked .answer-row, .card.picked .links, .card.picked .opt:not(.chosen):not(.staged):not(.pending) { opacity: .45; transition: opacity .15s; }
  .card.picked .opt:not(.chosen):not(.staged):not(.pending):hover, .card.picked .answer-row:focus-within, .card.picked .links:hover { opacity: 1; }
  .opt.text-answer { cursor: default; } .opt.text-answer .tag { color: var(--ok); } .opt.text-answer:hover { border-color: var(--ok); }
  .opt.staged { border-color: var(--stage); box-shadow: 0 0 0 1px var(--stage); background: var(--stage-soft); }
  .opt.pending { border-color: var(--stage); border-style: dashed; } .opt.pending .k { color: var(--stage); } .opt .check.pending { visibility: visible; color: var(--stage); display: flex; align-items: center; justify-content: center; }
  .locked .opt { cursor: default; } .locked .opt:hover { border-color: var(--rule); }
  .multi-hint { margin: 16px 0 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .multi-hint + .opts { margin-top: 8px; }
  .why { margin: 14px 0 0; font-size: 14px; color: var(--ink-2); white-space: pre-line; } .why b { color: var(--accent); font-weight: 600; }
  .why.lean b { color: var(--taste); } .note-taste { margin: 10px 0 0; font-size: 13px; color: var(--taste); }
  /* Поле ответа растёт под текст: диктуя длинно, человек не должен терять из
     виду собственные слова. Предел — чтобы карточка не уезжала целиком. */
  .answer-row textarea { min-height: 76px; max-height: 45vh; overflow-y: auto; }
  .staged-line { margin-top: 10px; font-size: 14px; color: var(--stage); } .staged-line a { color: var(--ink-3); font-size: 12px; margin-left: 8px; }
  .pending-line { margin-top: 10px; font-size: 14px; color: var(--stage); display: flex; align-items: center; gap: 8px; }
  .answer-row { display: flex; gap: 8px; margin-top: 20px; align-items: flex-start; }
  .links { margin-top: 12px; font-size: 13px; display: flex; gap: 14px; } .links a { color: var(--ink-3); text-decoration: none; } .links a:hover { color: var(--accent); }
  textarea { width: 100%; min-height: 60px; font: inherit; font-size: 14px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); resize: vertical; color: var(--ink); }
  textarea:focus { outline: none; border-color: var(--ink-3); }
  button { font-family: var(--sans); font-weight: 500; font-size: 14px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--ink-3); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-fill); } button.primary:hover { border-color: var(--accent); }
  button:disabled, button.primary:disabled { background: var(--ink-3); border-color: var(--ink-3); color: #fff; cursor: default; }
  main .empty { color: var(--ink-3); font-size: 14px; }

  aside { grid-row: 3; grid-column: 3; border-left: 1px solid var(--rule); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  aside .head { padding: 20px 22px 12px; }
  aside .head h3 { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  aside .head .sub { font-family: var(--serif); font-size: 16px; margin-top: 4px; }
  aside .head .count { font-size: 12px; color: var(--ink-3); margin-left: 8px; font-family: var(--sans); }
  aside .msgs { overflow-y: auto; padding: 0 22px 12px; }
  .msg { padding: 12px 0; border-top: 1px solid var(--rule); position: relative; }
  .msg .who { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; }
  .msg.user .who { color: var(--stage); } .msg.agent .who { color: var(--accent); }
  .msg.staged { background: var(--stage-soft); margin: 8px -10px 0; padding: 10px 28px 10px 10px; border-radius: 6px; border-top: 0; }
  .msg.pending { opacity: .7; } .msg.pending .who { display: flex; align-items: center; gap: 6px; }
  .msg .text { font-size: 14px; white-space: pre-line; }
  .msg .rm { position: absolute; right: 8px; top: 8px; color: var(--ink-3); text-decoration: none; font-size: 14px; }
  .empty-thread { padding: 12px 0; font-size: 13px; color: var(--ink-3); border-top: 1px solid var(--rule); }
  .explore-head { padding: 12px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; border-top: 1px solid var(--rule); }

function renderStatus() {

    return `<li class="opt${isRec ? (yours ? " lean" : " rec") : ""}${chosen ? " chosen" : ""}${staged ? " staged" : ""}${pending ? " pending" : ""}" data-opt="${esc(o.k)}"><span class="k">${esc(o.k)}</span><span>${isRec ? `<div class="tag">${yours ? T.myLean : T.recommended}</div>` : ""}${md(o.text)}${yours ? "" : chipRow(o)}</span>${pending ? `<span class="check pending"><span class="spin"></span></span>` : `<span class="check">${CHECK}</span>`}</li>`;
  }).join("") + (q.status === "answered" && q.answer && q.answer.kind === "text" && q.answer.text
    ? `<li class="opt chosen text-answer"><span class="k"></span><span><div class="tag">${T.yourAnswer}</div>${md(q.answer.text)}</span><span class="check">${CHECK}</span></li>` : "")
    + (pendAnswer && pendAnswer.kind === "text" && pendAnswer.text
    ? `<li class="opt pending text-answer"><span class="k"></span><span><div class="tag">${T.yourAnswerSending}</div>${md(pendAnswer.text)}</span><span class="check pending"><span class="spin"></span></span></li>` : "");
  const why = recKeys(q).length && yours ? `<p class="why lean"><b>${T.whyLean(esc(keyLabel(rec)))}</b> ${md(rec.why)}</p><p class="note-taste">${T.tasteNote}</p>`
    : recKeys(q).length ? `<p class="why"><b>${T.whyOption(esc(keyLabel(rec)))}</b> ${md(rec.why)}</p>`
    : rec.text ? `<p class="why"><b>Suggested.</b> ${md(rec.text)}${rec.why ? " — " + md(rec.why) : ""}</p>` : rec.why ? `<p class="why">${md(rec.why)}</p>` : "";
  let stagedLine = "";
  if (s.defer) stagedLine = T.stagedDefer;
  else if (s.reopen) stagedLine = T.stagedReopen;
  else if (s.answer) stagedLine = s.answer.kind === "accept" ? T.stagedAccept(esc(keyLabel(s.answer))) : keysOf(s.answer).length > 1 ? T.stagedOptions(esc(keyLabel(s.answer))) : keysOf(s.answer).length ? T.stagedOption(esc(keyLabel(s.answer))) : T.stagedText(esc(s.answer.text));
  if (stagedLine) stagedLine = `<div class="staged-line">${stagedLine}<a href="#" id="clear-staged">${T.clear}</a></div>`;
  const pendBits = pend.filter((a) => a.type === "defer" || a.type === "reopen").map((a) => (a.type === "defer" ? T.bitDefer : T.bitReopen));
  if (pendBits.length) stagedLine += `<div class="pending-line"><span class="spin"></span>${T.sentWaiting(pendBits.join(", "))}</div>`;
  const controls = lk ? "" : `
      <div class="answer-row">
        <textarea id="free" placeholder="${q.status === "answered" ? T.placeholderChange : (q.options || []).length ? T.placeholderFreeText : T.placeholderYourAnswer}">${esc(d.free || "")}</textarea>

  const exploring = isExploring(q.id);
  const gate = sendState(false);
  const exploreBtn = (q.options || []).length && !lk
    ? `<button id="explore" type="button"${exploring || gate.disabled ? " disabled" : ""}${gate.disabled && gate.why ? ` title="${esc(gate.why)}"` : ""}>${exploring ? `<span class="spin"></span> ${T.exploring}` : q.explore ? T.exploreAgain : T.exploreDeeper}</button>` : "";
  const picked = (q.status === "answered" && q.answer) || !!s.answer || !!pendAnswer;
  main.innerHTML = `<article class="card${lk ? " locked" : ""}${picked ? " picked" : ""}">
      <div class="crumb">${crumb.join("")}</div>

  main.querySelectorAll("[data-go]").forEach((a) => (a.onclick = (e) => { e.preventDefault(); if (byId(a.dataset.go)) { selected = a.dataset.go; render(); } }));

  const grow = (el) => { if (!el) return; el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, window.innerHeight * 0.45) + "px"; };
  $("free").oninput = (e) => { (local.drafts[q.id] = local.drafts[q.id] || {}).free = e.target.value; grow(e.target); save(); renderFooter(); };

function renderAside() {

function renderFooter() {

  const parts = Object.entries(local.staged).map(([id, s]) => {

    // Кружок значит «идёт прямо сейчас», а идёт оно не у нас. Отправка состоялась — галочка.
    fa.innerHTML = ms > FINISH_STALE_MS
      ? `<span class="confirm">${T.finishStale(fp.seq, fmtMs(ms))}</span>`
      : `<button id="finish" type="button" disabled><span class="spin"></span>${T.finishing}</button>`;
  }
  else if (confirmFinish) fa.innerHTML = `<span class="confirm">${T.finishConfirm} <button id="finish-yes" class="ready" type="button">${T.finish}</button><button id="finish-no" type="button">${T.cancel}</button></span>`;
  else {
    const a = (S && S.agent) || {}; const gate = sendState(false);

    fa.innerHTML = `<button id="finish" type="button" class="${ready ? "ready" : ""}"${gate.disabled ? " disabled" : ""}${ready ? ` title="${T.finishReadyTitle}"` : gate.disabled && gate.why ? ` title="${esc(gate.why)}"` : ""}>${T.finishGrill}</button>`;

  const fn = $("finish-no"); if (fn) fn.onclick = () => { confirmFinish = false; render(); };
  renderSend();
}

  b.disabled = disabled; b.textContent = n ? T.sendNToAgent(n) : T.sendToAgent;
  $("send-why").textContent = why;
}

// ---- theme: data-theme forces light/dark; "system" follows the OS via light-dark() ----
const THEMES = ["system", "light", "dark"];

      if (act.id === "feedback-in") { e.preventDefault(); stageFeedback(t); return; }

  }

applyI18n();
renderLang();
poll();
